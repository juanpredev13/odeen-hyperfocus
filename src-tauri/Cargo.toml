[package]
name = "odeen"
version = "0.1.0"
description = "ODEEN HyperFocus desktop and mobile shell"
authors = ["juanpredev13"]
license = ""
repository = "https://github.com/juanpredev13/odeen-hyperfocus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "odeen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
cpal = "0.17.1"
futures-util = "0.3.34"
notify-rust = "4"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "stream"] }
sha2 = "0.10"
tauri-plugin-global-shortcut = "2"
whisper-rs = "0.16.0"

# whisper.cpp is unusably slow at -O0; optimize it even in `tauri dev`.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

[profile.dev.package.whisper-rs]
opt-level = 3
